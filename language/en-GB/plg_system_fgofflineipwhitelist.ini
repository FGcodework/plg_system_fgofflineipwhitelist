; Package: FG.Plugin.System.Fgofflineipwhitelist
PLG_SYSTEM_FGOFFLINEIPWHITELIST="System - FG Offline IP Whitelist"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_SUPPORT_DESC="<style>a.fg-kofi[target='_blank']::before{content:none;padding:0}</style><div class='mb-3'><strong>This plugin is free and open source.</strong> If it has saved you time, a one-off tip on Ko-fi is welcome but entirely optional - no feature here is ever locked behind a paywall.</div><div class='d-flex align-items-center gap-3'><a href='https://ko-fi.com/fgcodework' target='_blank' rel='noopener noreferrer' class='fg-kofi'><img src='https://storage.ko-fi.com/cdn/kofi3.png?v=4' alt='ko-fi' width='180'></a><a href='https://fgcodework.github.io/' target='_blank' rel='noopener noreferrer' class='btn' style='--btn-color:var(--atum-btn);--btn-bg:var(--atum-btn-bg);--btn-border-color:hsl(var(--hue),20%,80%);--btn-hover-color:var(--atum-btn-hvr);--btn-hover-bg:var(--atum-btn-bg-hvr);--btn-hover-border-color:var(--atum-btn-bg-hvr);--btn-active-color:var(--atum-btn-hvr);--btn-active-bg:var(--atum-btn-bg-hvr);--btn-active-border-color:var(--atum-btn-bg-hvr)'>More FG Extensions</a></div>"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELDSET_SETTINGS="Settings"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_DETECTED_IP_LABEL="Your detected IP"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_DETECTED_IP_DESC="Shows the IP the plugin currently detects for you, resolved with the exact same logic used at runtime (including any unsaved changes to Trust X-Forwarded-For / Trusted proxy IPs / Client IP header on this form). Useful for finding the right value to add to Allowed IP addresses below - save the form after changing proxy settings to refresh this preview."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_DETECTED_IP_TEXT="Detected IP:"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_DETECTED_IP_DIRECT="Detected directly from the connection (Trust X-Forwarded-For is off, or the connecting peer is not a trusted proxy)."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_DETECTED_IP_VIA_PROXY="Resolved from the configured client-IP header, via trusted proxy %s."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_ALLOWED_IPS_LABEL="Allowed IP addresses"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_ALLOWED_IPS_DESC="One entry per line (or comma separated). Accepts exact IPv4/IPv6 addresses and CIDR ranges, e.g. 203.0.113.5 or 192.168.1.0/24. These visitors will see the live site even while Site Offline is enabled."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_TRUST_XFF_LABEL="Trust X-Forwarded-For header"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_TRUST_XFF_DESC="Enable only if the site runs behind a reverse proxy or CDN (e.g. Cloudflare, nginx). When enabled, the header is only trusted if the connecting peer's own IP is listed in Trusted proxy IPs below - this prevents visitors from spoofing the header to bypass the whitelist."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_TRUSTED_PROXIES_LABEL="Trusted proxy IPs"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_TRUSTED_PROXIES_DESC="One entry per line (or comma separated). IP addresses or CIDR ranges of your reverse proxy/CDN. Required for Trust X-Forwarded-For to take effect - if left empty, the X-Forwarded-For header is ignored entirely and the connecting peer's own IP is used instead. When a chain of proxies is present, the header is validated hop by hop from the connecting peer backwards; only the IP behind the last trusted proxy is used, so an untrusted hop earlier in the chain cannot spoof the result."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_IP_HEADER_LABEL="Client IP header"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_IP_HEADER_DESC="Which header carries the real visitor IP. X-Forwarded-For is the general-purpose standard used by most reverse proxies. CF-Connecting-IP and True-Client-IP are single-value headers set directly by Cloudflare (and, for the latter, some other CDNs/Akamai) - use one of these if your CDN sets it, since it does not require chain parsing. All options are only ever honoured when the connecting peer matches Trusted proxy IPs above."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_IP_HEADER_OPT_XFF="X-Forwarded-For"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_IP_HEADER_OPT_CF="CF-Connecting-IP (Cloudflare)"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_IP_HEADER_OPT_TCI="True-Client-IP (Cloudflare Enterprise / Akamai)"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_LOG_ACCESS_LABEL="Log whitelist bypasses"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_LOG_ACCESS_DESC="Write an entry to the Joomla log (fgofflineipwhitelist category) each time a visitor's IP matches the whitelist and the offline screen is bypassed."
